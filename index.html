<meta name="description" content="Backend & AI systems engineer. Portfolio in progress." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5EF;
    --text: #17211F;
    --text-soft: #4B5652;
    --main: #8A5A1E;
    --line: #DEDACB;
    --font-head: "Fraunces", Georgia, serif;
    --font-body: "Source Sans 3", -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: clamp(3rem, 10vw, 6rem) clamp(1.5rem, 6vw, 2.5rem);
  }
  .name {
    font-family: var(--font-head);
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    font-weight: 600;
    line-height: 1.1;
    margin: 0;
    color: var(--main);
  }
  .claim {
    font-family: var(--font-head);
    font-size: clamp(1.15rem, 4.2vw, 1.5rem);
    font-weight: 600;
    line-height: 1.35;
    margin: 1.25rem 0 0;
    max-width: 22ch;
    color: var(--text);
  }
  .role {
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin: 1.75rem 0 0;
  }
  footer {
    border-top: 1px solid var(--line);
    padding: 1.25rem clamp(1.5rem, 6vw, 2.5rem);
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  footer p {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--text-soft);
  }
</style>
</head>
<body>

  <main class="wrap">
    <h1 class="name">Ayman</h1>
    <p class="claim">I build AI features that refuse to be confidently wrong.</p>
    <p class="role">Backend &amp; AI Systems</p>
  </main>

  <footer>
    <p>Portfolio in progress — case studies landing soon.</p>
  </footer>

</body>
</html>
